{% extends 'admins/bases.html' %} {% block content %}
<div class="absolute top-0 left-0 w-4/6 mx-auto">
  <h1>Admin Panel</h1>
  <div class="mt-5 p-5">
    <table class="table border">
      <thead>
        <tr>
          <th>id</th>
          <th>Category</th>
        </tr>
      </thead>
      <tbody>
        {% for category in categories %}
        <tr>
          <th>{{ category.id }}</th>
          <th>{{ category.name }}</th>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>
{% endblock %}
