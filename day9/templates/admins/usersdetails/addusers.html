{% extends 'admins/bases.html' %} {% block content %}
<div class="absolute top-0 left-0 w-4/6 mx-auto">
  <h1>Admin Panel</h1>
  <div class="mt-5 p-5">
    <h1>Add Category</h1>
    <form method="post">
      {% csrf_token %}
      <label for="Category name ">Category Name</label>
      <input type="text" name="name" required />
      <button type="submit">Submit</button>
    </form>
  </div>
</div>
{% endblock %}
