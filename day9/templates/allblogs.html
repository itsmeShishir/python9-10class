{% extends "base.html" %} {% load static %} {% block content %}

<!-- News With Sidebar Start -->
<div class="container-fluid mt-5 pt-3">
  <div class="container">
    <div class="row">
      <div class="col-lg-8">
        <div class="row">
          <div class="col-12">
            <div class="section-title">
              <h4 class="m-0 text-uppercase font-weight-bold">All Blogs</h4>
            </div>
          </div>
          {% for news in blogs %}
          <div class="col-lg-6">
            <div class="position-relative mb-3">
              <img
                class="img-fluid w-100"
                src="{{ news.image.url }}"
                style="object-fit: cover"
              />
              <div class="bg-white border border-top-0 p-4">
                <div class="mb-2">
                  <a
                    class="badge badge-primary text-uppercase font-weight-semi-bold p-2 mr-2"
                    href=""
                    >{{news.category}}</a
                  >
                  <a class="text-body" href=""
                    ><small>{{news.pub_date}}</small></a
                  >
                </div>
                <a
                  class="h4 d-block mb-3 text-secondary text-uppercase font-weight-bold"
                  href="{% url 'single' news.id %}"
                  >{{news.title}}</a
                >
              </div>
              <div
                class="d-flex justify-content-between bg-white border border-top-0 p-4"
              >
                <div class="d-flex align-items-center">
                  <img
                    class="rounded-circle mr-2"
                    src="{% static 'img/user.jpg' %}"
                    width="25"
                    height="25"
                    alt=""
                  />
                  <small>John Doe</small>
                </div>
                <div class="d-flex align-items-center">
                  <small class="ml-3"
                    ><i class="far fa-eye mr-2"></i>12345</small
                  >
                  <small class="ml-3"
                    ><i class="far fa-comment mr-2"></i>123</small
                  >
                </div>
              </div>
            </div>
          </div>
          {% endfor %}
        </div>
      </div>
    </div>
  </div>
</div>
<!-- News With Sidebar End -->

{% endblock %}
